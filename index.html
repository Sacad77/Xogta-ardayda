<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Waxay ka dhigaysaa inuu si fiican uga dhex muuqdo mobile-ka -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Student Dashboard</title>
    <style>
        :root {
            --primary: #4e73df;
            --bg: #f8f9fc;
        }

        body { 
            font-family: sans-serif; 
            padding: 20px; 
            background-color: var(--bg);
            margin: 0;
        }

        .container {
            max-width: 100%; /* Waxay isticmaaleysaa inta ugu badan ee shaashadda */
            overflow-x: auto; /* Waxay u ogolaanaysaa in mobile-ka la isku jiido haddii miisku dheer yahay */
            background: white;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            min-width: 600px; /* Waxay ka hortagaysaa in miisku yaraado ilaa heer khatar ah */
            border-collapse: collapse;
        }

        th, td { 
            padding: 12px; 
            text-align: left; 
            border-bottom: 1px solid #eee; 
        }

        /* Responsive: Haddii shaashadu yaraato, font-ka ha yaraado */
        @media (max-width: 600px) {
            th, td { padding: 8px; font-size: 14px; }
            .btn { padding: 5px 10px; font-size: 12px; }
        }

        .btn { padding: 6px 12px; border-radius: 5px; border: none; cursor: pointer; }
        .btn-edit { background: #d1f7e0; color: #1cc88a; }
        .btn-delete { background: #fee2e2; color: #e74a3b; }
    </style>
</head>
<body>

<div class="container">
    <table>
        <thead>
            <tr style="background: var(--primary); color: white;">
                <th>ID</th><th>NAME</th><th>MATH</th><th>ENGLISH</th><th>SCIENCE</th><th>ACTION</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>C1250095</td><td>Sacad siciid</td><td>90</td><td>100</td><td>80</td>
                <td>
                    <button class="btn btn-edit">Edit</button>
                    <button class="btn btn-delete">Delete</button>
                </td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
