<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marks Report</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 40px; 
            background-color: #f8f9fa;
        }

        /* Waxaan ka dhigay max-width 100% si uu u noqdo mid ballaaran */
        .marks-table {
            width: 100%;
            max-width: 1200px; 
            margin: auto;
            border-collapse: collapse;
            background-color: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        caption { 
            font-size: 2em; 
            font-weight: bold; 
            color: #333; 
            margin-bottom: 25px; 
        }

        .marks-table thead {
            background-color: #007bff; 
            color: white;
        }

        /* Padding-ka waxaan ka dhigay mid weyn si uu ugu ekaado 39188_2.jpg */
        .marks-table th, .marks-table td {
            padding: 20px 30px; 
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        .marks-table tbody tr:nth-child(even) { background-color: #f9f9f9; }

        .btn-edit { 
            background-color: #28a745; 
            color: white; 
            border: none; 
            padding: 8px 20px; 
            cursor: pointer; 
            border-radius: 4px;
        }

        .btn-delete { 
            background-color: #dc3545; 
            color: white; 
            border: none; 
            padding: 8px 20px; 
            cursor: pointer; 
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <table class="marks-table">
        <caption>Student Marks Report</caption>
        <thead>
            <tr>
                <th>ID</th>
                <th>NAME</th>
                <th>MATH</th>
                <th>ENGLISH</th>
                <th>SCIENCE</th>
                <th>BUTTON</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>C1240001</td>
                <td>Ahmed Ali</td>
                <td>85</td>
                <td>90</td>
                <td>78</td>
                <td>
                    <button class="btn-edit">Edit</button>
                    <button class="btn-delete">Delete</button>
                </td>
            </tr>
            <!-- Ku dar safafkaaga kale halkan -->
        </tbody>
    </table>

</body>
</html>
